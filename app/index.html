<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vit-ui-prefs');
          var prefs = raw ? JSON.parse(raw).state : null;
          var theme = (prefs && prefs.theme) || 'system';
          var resolved = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          var scales = { sm: 93.75, base: 100, lg: 112.5, xl: 125 };
          var textScale = (prefs && prefs.textScale) || 'base';
          document.documentElement.style.fontSize = (scales[textScale] || 100) + '%';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Studio · VIT CSE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
